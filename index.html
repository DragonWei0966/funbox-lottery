let activeRegion = "全部";
const root = document.getElementById("stores");
const search = document.getElementById("search");

function key(store, code, url) {
  return "lottery_done|" + store + "|" + code + "|" + url;
}

function isDone(store, code, url) {
  return localStorage.getItem(key(store, code, url)) === "1";
}

function setDone(store, code, url, val) {
  localStorage.setItem(key(store, code, url), val ? "1" : "0");
}

function getImageUrl(code, name = "") {
  const n = String(name || "");

  // BX-00 特殊圖片對照
  if (code === "BX-00") {
    if (/蒼龍神劍/i.test(n) && /V2/i.test(n)) {
      return "images/BX-00-bxg49.webp";
    }

    if (/暴風天馬/i.test(n)) {
      return "images/BX-00-bxg47.webp";
    }
  }

  return `images/${code}.webp`;
}

function render() {
  const q = search.value.trim().toLowerCase();
  root.innerHTML = "";
  let shownStores = 0, shownItems = 0, doneItems = 0;

  stores.forEach((s, si) => {
    const isEmpty = s.items.length === 0;
    if (activeRegion === "未更新" && !isEmpty) return;
    if (!["全部", "最新更新", "未更新"].includes(activeRegion) && s.region !== activeRegion) return;

    const storeMatch = (s.name + " " + s.address + " " + s.region).toLowerCase().includes(q);
    const matchedItems = s.items.filter(it =>
      storeMatch || (it[0] + " " + it[1]).toLowerCase().includes(q)
    );

    if (q && !storeMatch && matchedItems.length === 0) return;
    if (!q && activeRegion === "未更新" && !isEmpty) return;

    shownStores++;
    shownItems += matchedItems.length;

    const card = document.createElement("section");
    card.className = "store" + (q ? " open" : "");
    card.innerHTML = `
      <div class="store-head">
        <div>
          <div class="store-title-row">
            <div class="store-title">${s.name}${s.latest ? ' <span class="new-badge">NEW</span>' : ''}</div>
            ${(s.facebook || s.line_id) ? `<div class="store-tools">
              ${s.line_id ? `<a class="store-link" href="https://line.me/R/ti/p/${s.line_id}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">LINE</a>` : ""}
              ${s.facebook ? `<a class="store-link" href="${s.facebook}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">FB</a>` : ""}
            </div>` : ""}
          </div>
          <div class="addr">${s.address}</div>
        </div>
        <div class="badge ${isEmpty ? "empty" : ""}">
          ${isEmpty ? "尚未更新" : s.items.length + " 個抽選"}
        </div>
      </div>
      <div class="items"></div>
    `;

    card.querySelector(".store-head").addEventListener("click", () => card.classList.toggle("open"));
    const itemsBox = card.querySelector(".items");

    if (isEmpty) {
      itemsBox.innerHTML = '<div class="emptybox">目前尚未更新抽選連結。</div>';
    } else {
      matchedItems.forEach((it) => {
        const [code, name, url] = it;
        const checked = isDone(s.name, code, url);
        if (checked) doneItems++;
        const row = document.createElement("div");
        row.className = "item" + (checked ? " done-item" : "");
        const imgUrl = getImageUrl(code, name);
        row.innerHTML = `
          <div class="thumb-wrap">
            ${imgUrl
              ? `<img class="thumb" src="${imgUrl}" alt="${code}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="thumb-placeholder" style="display:none"></div>`
              : `<div class="thumb-placeholder"></div>`}
          </div>
          <div class="item-main">
            <span class="code">${code}</span>
            <span class="name">${name}</span>
          </div>
          <a class="go" href="${url}" rel="noopener noreferrer">${checked ? "已開啟" : "抽選"}</a>
        `;
        row.querySelector(".go").addEventListener("click", () => {
          setDone(s.name, code, url, true);
          row.classList.add("done-item");
          row.querySelector(".go").textContent = "已開啟";
          updateStats();
        });
        itemsBox.appendChild(row);
      });
    }

    root.appendChild(card);
  });

  document.getElementById("noResults").style.display = shownStores ? "none" : "block";
  updateStats();
}

function updateStats() {
  const visibleStores = [...document.querySelectorAll(".store")];
  const visibleItems = [...document.querySelectorAll(".item")];
  const done = visibleItems.filter(x => x.classList.contains("done-item")).length;
  document.getElementById("summaryStat").textContent =
    `店家 ${visibleStores.length} ・ 抽選 ${visibleItems.length} ・ 已開啟 ${done} ・ 未開啟 ${visibleItems.length - done}`;
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    activeRegion = btn.dataset.region;
    render();
  });
});

search.addEventListener("input", render);
render();
</script>
</body>
</html>
